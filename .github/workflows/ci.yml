name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spova
          POSTGRES_PASSWORD: spova
          POSTGRES_DB: spova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spova" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://spova:spova@localhost:5432/spova?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_PUBLIC_BRAND_NAME: Zerventa
      INTERNAL_TOKEN: ci-internal-token-ci-internal-token-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spova/shared build
      - run: pnpm --filter @spova/api exec prisma validate
      - run: pnpm --filter @spova/api exec prisma migrate deploy
      - run: pnpm --filter @spova/api exec prisma generate
      - run: pnpm --filter @spova/api typecheck
      - run: pnpm --filter @spova/api build
      - run: pnpm --filter @spova/api prisma:seed
      - run: pnpm --filter @spova/worker prisma:generate
      - run: pnpm --filter @spova/worker typecheck
      - run: pnpm --filter @spova/worker test
      - run: pnpm --filter @spova/worker build
      - name: api e2e (phase 2 flows)
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:4000/health/ready && break; sleep 1; done
          pnpm --filter @spova/api test:e2e || { cat api.log; exit 1; }
          kill %1 || true
        env:
          SEED_ADMIN_EMAIL: admin@zerventa.local
          SEED_ADMIN_PASSWORD: Admin@12345
          API_URL: http://localhost:4000
      - run: pnpm --filter @spova/web build
