# Render Blueprint: API + worker (Docker) + Postgres + Redis. Web is deployed on Vercel (see docs/DEPLOY_RENDER_VERCEL.md).
# Free plans spin down when idle and the free Postgres expires after 30 days - fine for a client preview only.
services:
  - type: web
    name: spova-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: spova-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: spova-redis
          property: connectionString
      # The web app lives on www.zerventa.com (Vercel) and this API on api.zerventa.com (custom domain on this service).
      # These values are re-applied on every Blueprint sync, so they must be the real ones, not placeholders.
      - key: WEB_ORIGIN
        value: https://www.zerventa.com,https://zerventa.com
      - key: APP_DOMAIN
        value: zerventa.com
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        value: .zerventa.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_DEMO_CLIENT
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@zerventa.local
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: BRAND_NAME
        value: Zerventa
      - key: MAIL_PROVIDER
        value: console
      - key: MAIL_FROM
        value: info@zerventa.com
      - key: STORAGE_DRIVER
        value: local
      - key: DEMO_START_BALANCE
        value: "10000"

  # Runs as a "web" service only so it fits the free plan; it serves /health on $PORT and does its real work in the background.
  - type: web
    name: spova-worker
    runtime: docker
    plan: free
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spova-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: spova-redis
          property: connectionString
      - key: API_URL
        fromService:
          type: web
          name: spova-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTERNAL_TOKEN
        fromService:
          type: web
          name: spova-api
          envVarKey: INTERNAL_TOKEN
      - key: FEED_BINANCE
        value: "on"
      - key: FEED_SYNTHETIC
        value: "on"

  - type: keyvalue
    name: spova-redis
    plan: free
    ipAllowList: []

databases:
  - name: spova-db
    plan: free
    databaseName: spova
    user: spova
