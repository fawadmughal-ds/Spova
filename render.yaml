# Render Blueprint: API (Docker) + Postgres + Redis. Web is deployed on Vercel (see docs/DEPLOY_RENDER_VERCEL.md).
# Free plans spin down when idle and the free Postgres expires after 30 days - fine for a client preview only.
services:
  - type: web
    name: spova-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: spova-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: spova-redis
          property: connectionString
      - key: WEB_ORIGIN
        value: https://CHANGE-ME.vercel.app
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        value: ""
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_DEMO_CLIENT
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@xyz.local
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: BRAND_NAME
        value: XYZ
      - key: MAIL_PROVIDER
        value: console
      - key: DEMO_START_BALANCE
        value: "10000"

  - type: keyvalue
    name: spova-redis
    plan: free
    ipAllowList: []

databases:
  - name: spova-db
    plan: free
    databaseName: spova
    user: spova
